name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, not a tag, because a tag can be moved after the fact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json, the Node version from .nvmrc.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The unit tests call the CLI's run() directly. This runs the built binary the way a user would.
      - name: Run the built CLI on a fixture
        working-directory: fixtures/cli-usage
        run: |
          node ../../packages/cli/dist/bin.js --version
          code=0
          node ../../packages/cli/dist/bin.js check > /dev/null || code=$?
          # The fixture has a deliberate error. Exit 1 is the right answer: 0 would mean the rules did
          # not run, and 2 an input error.
          test "$code" -eq 1

  # The action builds the command line from its own source, with no pnpm set up for it, the way a project that
  # uses it would run it. It must pass on clean tokens and fail on a project that has errors.
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Passes on tokens with no findings
        uses: ./
        with:
          paths: fixtures/action-clean

      - name: Fails on a project with errors
        id: failing
        uses: ./
        continue-on-error: true
        with:
          working-directory: fixtures/cli-basic

      - name: The failing run really failed
        run: test "${{ steps.failing.outcome }}" = failure
